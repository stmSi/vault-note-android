[package]
name = "vaultnote-sync-server"
version = "0.1.0"
description = "Self-hostable opaque synchronization relay for VaultNote"
edition = "2024"
rust-version = "1.88"

[features]
default = ["cli"]
cli = [
    "dep:axum-server",
    "dep:clap",
    "tokio/macros",
    "tokio/net",
    "tokio/rt-multi-thread",
    "tokio/signal",
]

[[bin]]
name = "vaultnote-sync-server"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
axum = { version = "0.8.9", features = ["http1", "json", "tokio"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"], optional = true }
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"], optional = true }
futures-util = "0.3.32"
mdns-sd = { version = "0.20.3", default-features = false }
rand_core = { version = "0.6.4", features = ["getrandom"] }
rcgen = { version = "0.14.8", features = ["zeroize"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["fs", "io-util", "rt", "sync"] }
tokio-util = { version = "0.7.18", features = ["io"] }
uuid = { version = "1.23.5", features = ["v4"] }
zeroize = "1.8.2"

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"
